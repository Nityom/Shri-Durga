<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 50" width="480" height="50">
  <defs>
    <style>
      .logo-text { 
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; 
        font-weight: 700; 
        font-size: 32px; 
        fill: #0f172a; 
        letter-spacing: 2px;
      }
    </style>
  </defs>
  
  <!-- Medical Cross Icon - same height as text (32px) -->
  <g transform="translate(4, 9)">
    <!-- Shield background -->
    <path d="M16 0 L32 8 L32 20 C32 28 24 32 16 32 C8 32 0 28 0 20 L0 8 Z" 
          fill="#0f172a"/>
    <!-- Cross -->
    <rect x="13" y="6" width="6" height="20" fill="white"/>
    <rect x="6" y="12" width="20" height="6" fill="white"/>
  </g>
  
  <!-- Text - ShriDurga Hospital -->
  <text x="48" y="37" class="logo-text">ShriDurga Hospital</text>
</svg>
