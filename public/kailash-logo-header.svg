<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <style>
      .logo-text { 
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; 
        font-weight: 700; 
        fill: #0f172a; 
        letter-spacing: 1px;
      }
    </style>
  </defs>
  
  <!-- Medical Shield Icon - 52px height to match two rows of text -->
  <g transform="translate(4, 4)">
    <!-- Shield background -->
    <path d="M26 0 L52 13 L52 32 C52 45 39 52 26 52 C13 52 0 45 0 32 L0 13 Z" 
          fill="#0f172a"/>
    <!-- Cross -->
    <rect x="21" y="10" width="10" height="32" fill="white"/>
    <rect x="10" y="20" width="32" height="10" fill="white"/>
  </g>
  
  <!-- Text Row 1 - Shri Durga-->
  <text x="68" y="26" class="logo-text" font-size="22">KAILASH</text>
  
  <!-- Text Row 2 - HOSPITAL -->
  <text x="68" y="50" class="logo-text" font-size="18" font-weight="500" letter-spacing="3">HOSPITAL</text>
</svg>
